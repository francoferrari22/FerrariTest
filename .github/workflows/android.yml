name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'FerrariPOS_Mobile/mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Create Android platform
        working-directory: FerrariPOS_Mobile/mobile
        run: flutter create . --platforms=android --project-name=ferrari_pos_mobile

      - name: Get dependencies
        working-directory: FerrariPOS_Mobile/mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: FerrariPOS_Mobile/mobile
        run: flutter analyze

      - name: Build APK
        working-directory: FerrariPOS_Mobile/mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Android
          path: FerrariPOS_Mobile/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
