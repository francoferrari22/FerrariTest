name: FerrariPOS Android - APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generar APK FerrariPOS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FerrariPOS.Mobile/Android

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar proyecto
        run: |
          echo "=== DIRECTORIO ==="
          pwd
          echo "=== ARCHIVOS ==="
          find . -maxdepth 3 -type f | sort

      - name: Limpiar
        run: |
          gradle clean --stacktrace

      - name: Compilar APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --info 2>&1 | tee ferraripos-build.log
          exit ${PIPESTATUS[0]}

      - name: Mostrar error real
        if: steps.build.outcome == 'failure'
        working-directory: FerrariPOS.Mobile/Android
        run: |
          echo "========================================"
          echo "       ERROR DE COMPILACION"
          echo "========================================"
          echo ""
          grep -n -E "What went wrong|Caused by:|error:|ERROR|FAILURE:" ferraripos-build.log | tail -100 || true
          echo ""
          echo "========================================"
          echo "       ULTIMAS 150 LINEAS"
          echo "========================================"
          tail -150 ferraripos-build.log

      - name: Guardar diagnóstico completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Diagnostico
          path: FerrariPOS.Mobile/Android/ferraripos-build.log
          if-no-files-found: warn

      - name: Buscar APK
        if: always()
        working-directory: FerrariPOS.Mobile/Android
        run: |
          echo "=== APK ENCONTRADOS ==="
          find . -type f -name "*.apk" -print || true

      - name: Publicar APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Android-APK
          path: FerrariPOS.Mobile/Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Finalizar
        if: steps.build.outcome == 'failure'
        run: exit 1
