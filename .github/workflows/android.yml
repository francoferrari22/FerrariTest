name: Compilar FerrariPOS Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Release
        working-directory: FerrariPOS.Mobile/Android
        run: gradle assembleRelease --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Android
          path: FerrariPOS.Mobile/Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
