name: FerrariPOS Android - Diagnostico

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar y obtener diagnóstico
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Comprobar configuración
        working-directory: FerrariPOS.Mobile/Android
        run: |
          echo "=== JAVA ==="
          java -version
          echo ""
          echo "=== GRADLE ==="
          gradle --version
          echo ""
          echo "=== PROYECTO ==="
          ls -la
          echo ""
          echo "=== APP ==="
          ls -la app

      - name: Compilar y guardar diagnóstico
        working-directory: FerrariPOS.Mobile/Android
        continue-on-error: true
        run: |
          gradle assembleRelease --stacktrace --info > ferraripos-error.log 2>&1
          echo $? > resultado.txt

      - name: Mostrar diagnóstico
        if: always()
        working-directory: FerrariPOS.Mobile/Android
        run: |
          echo "========================================"
          echo "        DIAGNÓSTICO FERRARIPOS"
          echo "========================================"
          echo ""
          echo "RESULTADO:"
          cat resultado.txt || true
          echo ""
          echo "ERRORES IMPORTANTES:"
          grep -i -E "What went wrong|Caused by|Exception|error:|FAILURE|failed" ferraripos-error.log | tail -100 || true
          echo ""
          echo "ÚLTIMAS 200 LÍNEAS:"
          tail -200 ferraripos-error.log

      - name: Subir diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Diagnostico
          path: |
            FerrariPOS.Mobile/Android/ferraripos-error.log
            FerrariPOS.Mobile/Android/resultado.txt
          if-no-files-found: error

      - name: Comprobar resultado
        working-directory: FerrariPOS.Mobile/Android
        run: |
          RESULTADO=$(cat resultado.txt)
          if [ "$RESULTADO" != "0" ]; then
            echo "La compilación falló."
            exit 1
          fi
