name: FerrariPOS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar FerrariPOS Android
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Dar permisos a Gradle
        working-directory: FerrariPOS.Mobile/Android
        run: chmod +x gradlew || true

      - name: Compilar APK Release
        working-directory: FerrariPOS.Mobile/Android
        run: ./gradlew assembleRelease --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Android
          path: FerrariPOS.Mobile/Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
