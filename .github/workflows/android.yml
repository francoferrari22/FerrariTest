name: FerrariPOS Android - APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Generar APK FerrariPOS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FerrariPOS.Mobile/Android

    steps:

      - name: 1 - Descargar repositorio
        uses: actions/checkout@v4

      - name: 2 - Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 3 - Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4 - Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: 5 - Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 6 - Verificar proyecto
        run: |
          echo "Directorio:"
          pwd
          echo ""
          echo "Contenido:"
          ls -la
          echo ""
          echo "Aplicación:"
          ls -la app
          echo ""
          echo "Configuración:"
          cat settings.gradle.kts

      - name: 7 - Limpiar proyecto
        run: |
          gradle clean --stacktrace

      - name: 8 - Compilar APK Release
        id: build_apk
        run: |
          gradle assembleRelease --stacktrace --info

      - name: 9 - Buscar APK
        if: always()
        run: |
          echo "Buscando APK..."
          find . -type f -name "*.apk" -print || true

      - name: 10 - Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Android-APK
          path: FerrariPOS.Mobile/Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 11 - Guardar diagnóstico de Gradle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Gradle-Diagnostico
          path: |
            FerrariPOS.Mobile/Android/**/*.log
            FerrariPOS.Mobile/Android/**/build/reports/**
          if-no-files-found: warn
